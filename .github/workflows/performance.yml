name: Performance Test

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        default: "qa"
        type: choice
        options:
          - qa
          - perf
          - stage

jobs:
  jmeter:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker Image
        run: |
          docker build \
            -t jmeter-demo \
            -f docker/Dockerfile .

      - name: Run JMeter Test
        run: |
          TIMESTAMP=$(date +%Y-%m-%d_%H-%M-%S)

          echo "JTL_NAME=results_${TIMESTAMP}.jtl" >> $GITHUB_ENV

          mkdir -p ${{ github.workspace }}/results
          mkdir -p ${{ github.workspace }}/reports

          docker run --rm \
            -v ${{ github.workspace }}/tests:/tests \
            -v ${{ github.workspace }}/results:/results \
            -v ${{ github.workspace }}/data:/data \
            -v ${{ github.workspace }}/environments:/environments \
            jmeter-demo \
            jmeter -n \
            -q /environments/${{ github.event.inputs.environment }}.properties \
            -t /tests/DumyJSON.jmx \
            -f \
            -l /results/results_${TIMESTAMP}.jtl

      - name: Generate HTML Report
        run: |
          JTL_PATH="${{ github.workspace }}/results/${{ env.JTL_NAME }}"

          if [ ! -s "$JTL_PATH" ]; then
            echo "Error: El archivo JTL está vacío o no existe."
            exit 1
          fi

          docker run --rm \
            -v ${{ github.workspace }}/results:/results \
            -v ${{ github.workspace }}/reports:/reports \
            jmeter-demo \
            jmeter \
            -g /results/${{ env.JTL_NAME }} \
            -o /reports/report

      - name: Upload HTML Report Artifact
        uses: actions/upload-artifact@v4
        with:
          name: jmeter-report-${{ github.run_id }}
          path: reports/report